[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.89"
repository = "https://github.com/ericli/hedgehog"

[workspace.dependencies]
hedgehog-core = { path = "crates/hedgehog-core" }
hedgehog-daemon = { path = "crates/hedgehog-daemon" }

anyhow = "1"
axum = "0.8"
bollard = "0.21"
bytes = "1"
clap = { version = "4.6", features = ["derive", "env"] }
dirs = "7"
dotenvy = "0.15"
flate2 = "1"
futures-util = "0.3"
hex = "0.4"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio", "http1", "client-legacy", "server"] }
ignore = "0.4"
opentunnel = "=0.5.1"
qrcode = { version = "0.14", default-features = false }
rand = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream"] }
rusqlite = { version = "0.40", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tar = "0.4"
tempfile = "3"
thiserror = "2"
tokio = { version = "1.53", features = ["full"] }
tokio-stream = { version = "0.1", features = ["io-util"] }
tokio-util = { version = "0.7", features = ["io"] }
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
